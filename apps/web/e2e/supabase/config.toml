# Fallback Supabase CLI config for the end-to-end tests, used only when
# `supabase init` doesn't produce one (e2e/supabase-up.sh). Only what the tests
# need: Postgres, Auth with magic links into the local mail catcher, PostgREST.
project_id = "odio-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.rate_limit]
email_sent = 1000

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
max_frequency = "1s"

[edge_runtime]
enabled = false

[analytics]
enabled = false
