name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Schema conformance (examples)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: Validate example corpus against the schema
        run: npm run validate:examples

  js:
    name: JS workspaces (SDK, adapters, web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Single install at the workspace root. This links the workspaces and runs
      # the SDK's `prepare` script, building packages/ts-sdk/dist so dependents
      # (adapters, web) resolve a built @opendeviceio/sdk.
      - name: Install workspace dependencies
        run: npm ci || npm install

      # Build the SDK explicitly before adapters/web so their steps always see
      # a fresh dist even if install-time prepare is skipped (e.g. cache reuse).
      - name: Build SDK
        run: npm run build -w @opendeviceio/sdk

      - name: Test SDK
        run: npm run test -w @opendeviceio/sdk

      - name: Test adapters
        run: npm run test -w @opendeviceio/adapters

      - name: Test web (conflict rules, submission checks)
        run: npm run test -w @opendeviceio/web

      - name: Build web
        run: npm run build -w @opendeviceio/web

  genie:
    name: Genie importer (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genie
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  database:
    name: Database (migrations + RLS tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: odio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply every migration, re-apply the newer ones, run the RLS tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: odio_test
        run: bash apps/web/supabase/tests/run.sh

      - name: Every id prefix is its brand slug (test data plus the E2E seed)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: odio_test
        run: |
          psql -v ON_ERROR_STOP=1 -q -X -f apps/web/e2e/seed.sql
          node scripts/check-id-prefixes.mjs --db

  e2e:
    name: End-to-end (Playwright, local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_EMAILS: admin@odio.test
      E2E_ADMIN_EMAIL: admin@odio.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install workspace dependencies
        run: npm ci || npm install

      - name: Set up the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned: "latest" asks the GitHub API for the newest release, and the
          # runner's anonymous API quota can run out (the CLI then never installs).
          version: 3.4.0

      # Postgres, Auth (magic links into a local mail catcher) and PostgREST,
      # with every migration in this repo, plus a small seed.
      - name: Start local Supabase
        run: bash apps/web/e2e/supabase-up.sh

      - name: Build the site against it
        run: npm run build -w @opendeviceio/web

      - name: Install Playwright
        working-directory: apps/web
        run: |
          npm install --no-save @playwright/test@1.49.1
          npx playwright install --with-deps chromium

      - name: End-to-end specs (claim a brand; canonical URLs, sitemap, robots)
        working-directory: apps/web
        run: npx playwright test -c e2e

      - name: Stop local Supabase
        if: always()
        run: supabase --workdir "${{ runner.temp }}/odio-e2e" stop --no-backup || true
